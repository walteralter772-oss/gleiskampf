<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Gleiskampf</title>
<meta name="description" content="Sammle deutsche Züge und kämpfe von Bahnhof zu Bahnhof.">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gleiskampf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top">
    <button id="btn-back" class="iconbtn" aria-label="Zurück" hidden>‹</button>
    <button id="logo" class="logo" aria-label="Zur Startseite"><span class="logo-mark">G</span><span class="logo-text">GLEISKAMPF</span></button>
    <div class="spacer"></div>
    <div class="coins" aria-label="Münzen"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#ffb000"/><circle cx="12" cy="12" r="7" fill="none" stroke="#a66a00" stroke-width="1.6"/><path d="M9 12h6" stroke="#a66a00" stroke-width="1.8"/></svg><b id="coins-n">0</b></div>
    <button id="btn-sound" class="iconbtn" aria-label="Ton an oder aus" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9Z" fill="currentColor"/><path class="wave" d="M16 8.500a5 5 0 0 1 0 7M18.500 6a8.500 8.500 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <main id="screen" class="screen"></main>
  <nav id="nav" aria-label="Hauptmenü">
    <button data-nav="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 2 5 13.500h6L10 22l9-12h-6Z" fill="currentColor"/></svg><span>Kämpfen</span></button>
    <button data-nav="decks"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="12" height="15" rx="2" fill="currentColor" opacity=".5"/><rect x="8" y="3" width="12" height="15" rx="2" fill="currentColor"/></svg><span>Decks</span></button>
    <button data-nav="album"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12a2 2 0 0 1 2 2v16H7a2 2 0 0 1-2-2Z" fill="currentColor"/><path d="M9 8h6M9 12h6" stroke="var(--bg)" stroke-width="1.800" stroke-linecap="round"/></svg><span>Album</span></button>
    <button data-nav="shop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v4H3zM5 11h14v10H5z" fill="currentColor"/><path d="M12 7v14" stroke="var(--bg)" stroke-width="2"/></svg><span>Packs</span></button>
  </nav>
</div>
<div id="modal-root"></div>
<noscript>Gleiskampf braucht JavaScript.</noscript>
<script src="trains.js"></script>
<script src="audio.js"></script>
<script src="bridge.js"></script>
<script src="game.js"></script>
</body>
</html>
